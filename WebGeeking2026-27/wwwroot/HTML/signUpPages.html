<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Homepage</title>
</head>
<body>
    <table border="1"
           style="width:100%"
           cellpadding="15">
        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td style="width:20%"></td>
            <td align="center"
                colspan="4">
                <h1> HTML Sign Up Form</h1>
            </td>
            <td style="width:20%"></td>
        </tr>

    </table>
    <td></td>
    <table border="1" style="width:100%">
        <tr></tr>
        <tr>
            <td style="width:20%"></td>
            <td>
                <form action="submit.html" method="post">
                    <table align="center"
                           border="1" dir="rtl"
                           placeholder="Enter your name">
                        <tr>
                            <td>שם פרטי:</td>
                            <td>
                                <input type="text" id="fName" name="fName" maxlength="50" placeholder="שם פרטי" />
                            </td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>שם משפחה:</td>
                            <td>
                                <input type="text" id="lName" name="lName" maxlength="50" placeholder="שם משפחה" />
                            </td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>Email:</td>
                            <td>
                                <input type="text" id="Email" name="Email" maxlength="50" placeholder="Email" />
                            </td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>סיסמה:</td>
                            <td>
                                <input type="password" id="Password" name="Password" maxlength="50" placeholder="סיסמה" />
                            </td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>נייד:</td>
                            <td>
                                <input type="number"
                                       id="uMobie"
                                       name="uMobie" maxlength="7"
                                       placeholder="נייד" />
                                <select id="pref" name="pref">
                                    <option value="050">050</option>
                                    <option value="051">051</option>
                                    <option value="052" selected>052</option>
                                    <option value="053">053</option>
                                    <option value="054">054</option>
                                    <option value="055">055</option>
                                    <option value="056">056</option>
                                    <option value="057">057</option>
                                    <option value="058">058</option>
                                    <option value="059">059</option>
                                </select>
                            </td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>תאריך לידה:</td>
                            <td>
                                <input type="date" id="uDate" name="uDate" />
                            </td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>מין:</td>
                            <td>
                                <input type="radio" id="male" name="gender" value="male" checked />
                                <label for="male">זכר</label>
                                <input type="radio" id="female" name="gender" value="female" />
                                <label for="female">נקבה</label>
                            </td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>תחומי עניין:</td>
                            <td>
                                <input type="checkbox" id=" " name="interests" value="sports" />
                                <label for="sports">ספורט</label>
                                <input type="checkbox" id="music" name="interests" value="music" />
                                <label for="music">מוזיקה</label>
                                <input type="checkbox" id="travel" name="interests" value="travel" />
                                <label for="travel">טיולים</label>
                            </td>
                            <td></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <input type="submit" value="שליחה" />
                                resset
                                <input type="reset" value="איפוס" />
                            </td>
                            <td></td>
                        </tr>
                    </table>
                </form>
            </td>
            <td style="width:20%"></td>
        </tr>
    </table>

</body>
</html>
