<!DOCTYPE html>

<html>

<head>

    <meta charset="utf-8" />

    <title>דף הרשמה</title>

</head>

<body>

    <table align="center"
           border="1"
           style="width:75%"
           cellpadding="15">

        <tr>

            <th colspan="16"></th>

        </tr>

        <tr>

            <th colspan="4" style="width:25%"></th>

            <td colspan="4" style="width:25%">

                LOGO

            </td>

            <td style="width:6.25%">צור קשר</td>

            <td style="width:6.25%">תקנון</td>

            <td style="width:6.25%">אודות</td>

            <td style="width:6.25%">על הפרויקט</td>

            <th colspan="4" style="width:25%"></th>

        </tr>

        <tr>

            <td style="width:20%; background-color:lightsteelblue; color:green"
                align="center"
                colspan="16">

                <h3>דף הרשמה</h3>

            </td>

        </tr>

    </table>

    <br />

    <table align="center"
           border="1"
           style="width:75%"
           cellpadding="10">

        <tr>

            <td width="50%">

                <form action="submit.html" method="post">

                    <table border="1"
                           dir="rtl"
                           width="100%"
                           cellpadding="10">

                        <tr>

                            <td><h4>טלפון:</h4></td>

                            <td>

                                <select id="pref" name="pref">

                                    <option value="050">050</option>

                                    <option value="051">051</option>

                                    <option value="052" selected>052</option>

                                    <option value="053">053</option>

                                    <option value="054">054</option>

                                    <option value="055">055</option>

                                    <option value="056">056</option>

                                    <option value="057">057</option>

                                    <option value="058">058</option>

                                    <option value="059">059</option>

                                </select>

                                <input type="tel"
                                       id="uMobile"
                                       name="uMobile"
                                       maxlength="7"
                                       placeholder="טלפון נייד" />

                            </td>

                        </tr>

                        <tr>

                            <td><h4>תאריך לידה:</h4></td>

                            <td>

                                <select id="day" name="day">

                                    <option value="">יום</option>

                                    <option value="1">1</option>

                                    <option value="2">2</option>

                                    <option value="3">3</option>

                                    <option value="4">4</option>

                                    <option value="5">5</option>

                                    <option value="6">6</option>

                                    <option value="7">7</option>

                                    <option value="8">8</option>

                                    <option value="9">9</option>

                                    <option value="10">10</option>

                                    <option value="11">11</option>

                                    <option value="12">12</option>

                                    <option value="13">13</option>

                                    <option value="14">14</option>

                                    <option value="15">15</option>

                                    <option value="16">16</option>

                                    <option value="17">17</option>

                                    <option value="18">18</option>

                                    <option value="19">19</option>

                                    <option value="20">20</option>

                                    <option value="21">21</option>

                                    <option value="22">22</option>

                                    <option value="23">23</option>

                                    <option value="24">24</option>

                                    <option value="25">25</option>

                                    <option value="26">26</option>

                                    <option value="27">27</option>

                                    <option value="28">28</option>

                                    <option value="29">29</option>

                                    <option value="30">30</option>

                                    <option value="31">31</option>

                                </select>

                                <select id="month" name="month">

                                    <option value="">חודש</option>

                                    <option value="1">ינואר</option>

                                    <option value="2">פברואר</option>

                                    <option value="3">מרץ</option>

                                    <option value="4">אפריל</option>

                                    <option value="5">מאי</option>

                                    <option value="6">יוני</option>

                                    <option value="7">יולי</option>

                                    <option value="8">אוגוסט</option>

                                    <option value="9">ספטמבר</option>

                                    <option value="10">אוקטובר</option>

                                    <option value="11">נובמבר</option>

                                    <option value="12">דצמבר</option>

                                </select>

                                <select id="year" name="year">

                                    <option value="">שנה</option>

                                    <option value="2000">2000</option>

                                    <option value="2001">2001</option>

                                    <option value="2002">2002</option>

                                    <option value="2003">2003</option>

                                    <option value="2004">2004</option>

                                    <option value="2005">2005</option>

                                    <option value="2006">2006</option>

                                    <option value="2007">2007</option>

                                    <option value="2008">2008</option>

                                    <option value="2009">2009</option>

                                    <option value="2010">2010</option>

                                    <option value="2011">2011</option>

                                    <option value="2012">2012</option>

                                    <option value="2013">2013</option>

                                    <option value="2014">2014</option>

                                    <option value="2015">2015</option>

                                    <option value="2016">2016</option>

                                    <option value="2017">2017</option>

                                    <option value="2018">2018</option>

                                    <option value="2019">2019</option>

                                    <option value="2020">2020</option>

                                    <option value="2021">2021</option>

                                    <option value="2022">2022</option>

                                    <option value="2023">2023</option>

                                    <option value="2024">2024</option>

                                    <option value="2025">2025</option>

                                    <option value="2026">2026</option>

                                    <option value="2027">2027</option>

                                </select>

                            </td>

                        </tr>

                        <tr>

                            <td><h4>מגדר:</h4></td>

                            <td>

                                <input type="radio"
                                       id="male"
                                       name="gender"
                                       value="male" />

                                <label for="male">זכר</label>

                                <input type="radio"
                                       id="female"
                                       name="gender"
                                       value="female" />

                                <label for="female">נקבה</label>

                            </td>

                        </tr>

                        <tr>

                            <td><h4>תקנון:</h4></td>

                            <td>

                                <input type="checkbox"
                                       id="terms"
                                       name="terms"
                                       value="yes" />

                                אני מאשר/ת את

                                <a href="https://handasaim.co.il/students/terms">תנאי השימוש</a>

                                באתר

                            </td>

                        </tr>

                        <tr>

                            <td></td>

                            <td>

                                <input type="submit"
                                       value="Submit"
                                       style="background-color:green; color:white; width:100%; padding:10px" />

                            </td>

                        </tr>

                    </table>

                </form>

            </td>

            <td width="50%">

                <form action="submit.html" method="post">

                    <table border="1"
                           dir="rtl"
                           width="100%"
                           cellpadding="10">

                        <tr>

                            <td><h4>שם פרטי:</h4></td>

                            <td>

                                <input type="text"
                                       id="fName"
                                       name="fName"
                                       maxlength="50"
                                       placeholder="שם פרטי" />

                            </td>

                        </tr>

                        <tr>

                            <td><h4>שם משפחה:</h4></td>

                            <td>

                                <input type="text"
                                       id="lName"
                                       name="lName"
                                       maxlength="50"
                                       placeholder="שם משפחה" />

                            </td>

                        </tr>

                        <tr>

                            <td><h4>Email:</h4></td>

                            <td>

                                <input type="email"
                                       id="Email"
                                       name="Email"
                                       maxlength="50"
                                       placeholder="Email" />

                            </td>

                        </tr>

                        <tr>

                            <td><h4>סיסמה:</h4></td>

                            <td>

                                <input type="password"
                                       id="Password"
                                       name="Password"
                                       maxlength="50"
                                       placeholder="סיסמה" />

                                <br />

                                <input type="checkbox"
                                       onclick="document.getElementById('Password').type=this.checked?'text':'password'" />

                                Show Password

                            </td>

                        </tr>

                        <tr>

                            <td><h4>אימות סיסמה:</h4></td>

                            <td>

                                <input type="password"
                                       id="confirmPassword"
                                       name="confirmPassword"
                                       maxlength="50"
                                       placeholder="אימות סיסמה" />

                            </td>

                        </tr>

                    </table>

                </form>

            </td>

        </tr>

    </table>

</body>

</html>
