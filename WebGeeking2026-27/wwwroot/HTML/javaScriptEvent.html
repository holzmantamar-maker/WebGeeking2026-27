
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>JavaScript Events</title>

    <style>
        img {
            width: 300px;
            height: auto;
        }
    </style>

    <script>
        function toSecondImage() {
            document.getElementById("demo").src =
                "https://images.unsplash.com/photo-1517849845537-4d257902454a?w=500";
        }

        function toFirstImage() {
            document.getElementById("demo").src =
                "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=500";
        }
    </script>

</head>

<body>

    <h1 style="text-align:center">Queen Tamar</h1>

    <div align="center">

        <img id="demo"
             src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=500"
             alt="First picture"
             onmouseover="toSecondImage()"
             onmouseout="toFirstImage()">

    </div>

</body>
</html>
